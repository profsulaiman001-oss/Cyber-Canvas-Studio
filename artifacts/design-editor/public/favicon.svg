<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background tile -->
  <rect width="180" height="180" rx="38" fill="#0B0C10"/>

  <!-- Left control arm -->
  <line x1="16" y1="90" x2="58" y2="90" stroke="#00F5FF" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
  <!-- Left handle: open circle -->
  <circle cx="16" cy="90" r="11" stroke="#00F5FF" stroke-width="5.5" fill="none"/>

  <!-- Right control arm -->
  <line x1="122" y1="90" x2="164" y2="90" stroke="#00F5FF" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
  <!-- Right handle: open circle -->
  <circle cx="164" cy="90" r="11" stroke="#00F5FF" stroke-width="5.5" fill="none"/>

  <!-- Center anchor node: solid diamond -->
  <!-- 56×56 rect rotated 45° centered at 90,90 -->
  <rect x="62" y="62" width="56" height="56" fill="#00F5FF" rx="7" transform="rotate(45 90 90)"/>
  <!-- Inner cutout for depth/hollow effect -->
  <rect x="73" y="73" width="34" height="34" fill="#0B0C10" rx="4" transform="rotate(45 90 90)"/>
</svg>
