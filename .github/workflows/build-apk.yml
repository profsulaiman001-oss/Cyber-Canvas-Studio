name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Ensure Capacitor Packages Installed
        run: pnpm add -w -D @capacitor/cli @capacitor/android @capacitor/core

      - name: Build Web Assets
        run: pnpm --filter design-editor exec vite build

      - name: Add and Sync Capacitor Android
        working-directory: artifacts/design-editor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Make Gradlew Executable & Build Debug APK
        working-directory: artifacts/design-editor/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: artifacts/design-editor/android/app/build/outputs/apk/debug/app-debug.apk
